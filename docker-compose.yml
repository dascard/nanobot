version: "3.8"

services:
  nanobot-server:
    build: .
    container_name: nanobot-server
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./sentinel:/app/sentinel
    restart: unless-stopped

# ── 如需与 Dify 同网段通信，取消下方注释 ──
