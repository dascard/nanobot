x-nanobot-logging: &nanobot-logging
  driver: json-file
  options:
    max-size: "${NANOBOT_DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${NANOBOT_DOCKER_LOG_MAX_FILES:-3}"

services:
  nanobot-server:
    image: ${NANOBOT_RUNTIME_IMAGE:-nanobot-runtime:latest}
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_FULL_COMMIT: ${GIT_FULL_COMMIT:-}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-}
        GIT_DIRTY: ${GIT_DIRTY:-null}
        BUILD_CONTEXT_SHA256: ${BUILD_CONTEXT_SHA256:-}
    container_name: nanobot-server
    user: "${NANOBOT_RUNTIME_UID:-10001}:${NANOBOT_RUNTIME_GID:-10001}"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HOME: /home/nanobot
      NANOBOT_PUSH_TOKEN: ""
      NANOBOT_SESSION_SUMMARY_WORKER_MODE: external
      NANOBOT_SANDBOXD_SOCKET: /run/nanobot-sandboxd/sandboxd.sock
      NANOBOT_SANDBOXD_TOKEN_FILE: /run/nanobot-sandboxd/client.token
      NANOBOT_SANDBOXD_ADMIN_TOKEN_FILE: /run/nanobot-sandboxd/admin-client.token
      NANOBOT_SANDBOX_INFRASTRUCTURE_ENABLE_ALLOWED: ${NANOBOT_SANDBOX_INFRASTRUCTURE_ENABLE_ALLOWED:-true}
    group_add:
      - "${NANOBOT_SANDBOXD_GID:-10001}"
    volumes:
      - ./data:/app/data
      - ./sentinel:/app/sentinel
      - ./models:/app/models
      - /run/nanobot-sandboxd:/run/nanobot-sandboxd:ro
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${NANOBOT_SERVER_PIDS_LIMIT:-512}
    mem_limit: ${NANOBOT_SERVER_MEMORY_LIMIT:-2g}
    cpus: "${NANOBOT_SERVER_CPU_LIMIT:-2.0}"
    tmpfs:
      - /tmp:size=128m,mode=1777,nosuid,nodev,noexec
      - /app/tmp:size=128m,mode=1777,nosuid,nodev,noexec
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *nanobot-logging
    restart: unless-stopped

  session-summary-worker:
    image: ${NANOBOT_RUNTIME_IMAGE:-nanobot-runtime:latest}
    container_name: nanobot-session-summary-worker
    user: "${NANOBOT_RUNTIME_UID:-10001}:${NANOBOT_RUNTIME_GID:-10001}"
    command: python -m workers.session_summary_worker --loop --interval 10
    environment:
      HOME: /home/nanobot
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/nanobot.db}
      LOG_DIR: ${LOG_DIR:-./data}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NEW_API_BASE_URL: ${NEW_API_BASE_URL:-https://api.new-api.com/v1}
      NEW_API_KEY: ${NEW_API_KEY:-}
      NEW_API_TIMEOUT: ${NEW_API_TIMEOUT:-300}
      NEW_API_MAX_RETRIES: ${NEW_API_MAX_RETRIES:-3}
      LLM_MODEL_SESSION_SUMMARY: ${LLM_MODEL_SESSION_SUMMARY:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-}
      CLASSIFIER_API_URL: ${CLASSIFIER_API_URL:-http://172.17.0.1:9999/v1}
      NANOBOT_PROMPT_DEFAULT_DIR: ${NANOBOT_PROMPT_DEFAULT_DIR:-./prompts.v2.default}
      NANOBOT_PROMPT_RUNTIME_DIR: ${NANOBOT_PROMPT_RUNTIME_DIR:-./data/prompts_v2}
    volumes:
      - ./data:/app/data
      - ./sentinel:/app/sentinel
      - ./models:/app/models
    depends_on:
      nanobot-server:
        condition: service_healthy
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${NANOBOT_SUMMARY_WORKER_PIDS_LIMIT:-256}
    mem_limit: ${NANOBOT_SUMMARY_WORKER_MEMORY_LIMIT:-1g}
    cpus: "${NANOBOT_SUMMARY_WORKER_CPU_LIMIT:-1.0}"
    tmpfs:
      - /tmp:size=128m,mode=1777,nosuid,nodev,noexec
      - /app/tmp:size=128m,mode=1777,nosuid,nodev,noexec
    healthcheck:
      test: ["CMD", "python", "-m", "core.runtime_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *nanobot-logging
    restart: unless-stopped

  outbound-delivery-worker:
    image: ${NANOBOT_RUNTIME_IMAGE:-nanobot-runtime:latest}
    container_name: nanobot-outbound-delivery-worker
    user: "${NANOBOT_RUNTIME_UID:-10001}:${NANOBOT_RUNTIME_GID:-10001}"
    command: python -m workers.outbound_delivery_worker --loop
    environment:
      HOME: /home/nanobot
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/nanobot.db}
      LOG_DIR: ${LOG_DIR:-./data}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NANOBOT_PUSH_TOKEN: ${NANOBOT_PUSH_TOKEN:-}
      QQBOT_PUSH_URL: ${QQBOT_PUSH_URL:-http://172.17.0.1:8082/nanobot/push}
      QQBOT_PUSH_TIMEOUT: ${QQBOT_PUSH_TIMEOUT:-180}
      NANOBOT_QQ_PUSH_CONFIG_REVISION: ${NANOBOT_QQ_PUSH_CONFIG_REVISION:-1}
      NANOBOT_PUBLIC_BASE_URL: ${NANOBOT_PUBLIC_BASE_URL:-}
      NANOBOT_ASSET_TOKEN_SECRET: ${NANOBOT_ASSET_TOKEN_SECRET:-}
      NANOBOT_ASSET_TOKEN_TTL_SECONDS: ${NANOBOT_ASSET_TOKEN_TTL_SECONDS:-300}
      NANOBOT_OUTBOUND_BATCH_SIZE: ${NANOBOT_OUTBOUND_BATCH_SIZE:-20}
      NANOBOT_OUTBOUND_LEASE_SECONDS: ${NANOBOT_OUTBOUND_LEASE_SECONDS:-240}
      NANOBOT_OUTBOUND_POLL_INTERVAL: ${NANOBOT_OUTBOUND_POLL_INTERVAL:-1}
    volumes:
      - ./data:/app/data
    depends_on:
      nanobot-server:
        condition: service_healthy
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${NANOBOT_OUTBOUND_WORKER_PIDS_LIMIT:-128}
    mem_limit: ${NANOBOT_OUTBOUND_WORKER_MEMORY_LIMIT:-512m}
    cpus: "${NANOBOT_OUTBOUND_WORKER_CPU_LIMIT:-0.5}"
    tmpfs:
      - /tmp:size=128m,mode=1777,nosuid,nodev,noexec
      - /app/tmp:size=128m,mode=1777,nosuid,nodev,noexec
    healthcheck:
      test: ["CMD", "python", "-m", "core.runtime_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 5m
    logging: *nanobot-logging
    restart: unless-stopped

  semantic-index-worker:
    image: ${NANOBOT_RUNTIME_IMAGE:-nanobot-runtime:latest}
    container_name: nanobot-semantic-index-worker
    user: "${NANOBOT_RUNTIME_UID:-10001}:${NANOBOT_RUNTIME_GID:-10001}"
    command: python -m workers.semantic_index_worker --loop --interval 10 --owner semantic-index-worker
    environment:
      HOME: /home/nanobot
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/nanobot.db}
      LOG_DIR: ${LOG_DIR:-./data}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEMANTIC_INDEX_ENABLED: ${SEMANTIC_INDEX_ENABLED:-1}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-}
    volumes:
      - ./data:/app/data
      - ./sentinel:/app/sentinel
      - ./models:/app/models
    depends_on:
      nanobot-server:
        condition: service_healthy
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${NANOBOT_SEMANTIC_WORKER_PIDS_LIMIT:-256}
    mem_limit: ${NANOBOT_SEMANTIC_WORKER_MEMORY_LIMIT:-1g}
    cpus: "${NANOBOT_SEMANTIC_WORKER_CPU_LIMIT:-1.0}"
    tmpfs:
      - /tmp:size=128m,mode=1777,nosuid,nodev,noexec
      - /app/tmp:size=128m,mode=1777,nosuid,nodev,noexec
    healthcheck:
      test: ["CMD", "python", "-m", "core.runtime_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *nanobot-logging
    restart: unless-stopped
