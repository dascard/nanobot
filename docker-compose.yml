version: "3.8"

services:
  nanobot-server:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-}
        GIT_DIRTY: ${GIT_DIRTY:-null}
    container_name: nanobot-server
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./sentinel:/app/sentinel
    restart: unless-stopped

# ── 如需与 Dify 同网段通信，取消下方注释 ──
# networks:
#   default:
#     external:
#       name: docker_default   # 替换为 Dify 的 docker network 名称
