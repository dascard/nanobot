visible_hostname nanobot-sandbox-egress

http_port 3128
pid_filename none

cache_effective_user proxy
cache_effective_group proxy
cache deny all
cache_mem 32 MB
maximum_object_size 0 KB
coredump_dir /tmp

access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
via on
forwarded_for delete

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443

acl allowed_domains dstdomain \
    github.com \
    api.github.com \
    objects.githubusercontent.com \
    raw.githubusercontent.com \
    codeload.github.com \
    pypi.org \
    files.pythonhosted.org \
    registry.npmjs.org

acl denied_ipv4 dst \
    0.0.0.0/8 \
    10.0.0.0/8 \
    100.64.0.0/10 \
    127.0.0.0/8 \
    169.254.0.0/16 \
    172.16.0.0/12 \
    192.0.0.0/24 \
    192.0.2.0/24 \
    192.168.0.0/16 \
    198.18.0.0/15 \
    198.51.100.0/24 \
    203.0.113.0/24 \
    224.0.0.0/4 \
    240.0.0.0/4

acl denied_ipv6 dst \
    ::/128 \
    ::1/128 \
    ::ffff:0:0/104 \
    ::ffff:a00:0/104 \
    ::ffff:6440:0/106 \
    ::ffff:7f00:0/104 \
    ::ffff:a9fe:0/112 \
    ::ffff:ac10:0/108 \
    ::ffff:c000:0/120 \
    ::ffff:c000:200/120 \
    ::ffff:c0a8:0/112 \
    ::ffff:c612:0/111 \
    ::ffff:c633:6400/120 \
    ::ffff:cb00:7100/120 \
    ::ffff:e000:0/100 \
    ::ffff:f000:0/100 \
    64:ff9b::/96 \
    100::/64 \
    2001:10::/28 \
    2001:db8::/32 \
    fc00::/7 \
    fe80::/10 \
    ff00::/8

http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !allowed_domains
http_access deny denied_ipv4
http_access deny denied_ipv6
http_access allow all
http_access deny all
