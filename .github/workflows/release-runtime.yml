name: Runtime 不可变发布

on:
  workflow_run:
    workflows:
      - 通用质量门禁
    types:
      - completed

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: runtime-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release-runtime:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出质量门禁对应源码
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 绑定同一提交的质量与 Eval 证据
        id: verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=normal)"
          kt_sha="$(git -C vendor/KohakuTerrarium rev-parse HEAD)"
          test "${kt_sha}" = "$(git rev-parse HEAD:vendor/KohakuTerrarium)"

          quality_jobs="$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}/jobs" \
            -f per_page=100)"
          for required_job in backend frontend; do
            jq -e --arg name "${required_job}" \
              'any(.jobs[]; .name == $name and .conclusion == "success")' \
              <<<"${quality_jobs}" >/dev/null
          done

          eval_run=""
          for _attempt in {1..80}; do
            eval_runs="$(gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/timing-gate-eval.yml/runs" \
              -f head_sha="${SOURCE_SHA}" \
              -f per_page=100)"
            eval_run="$(jq -c --arg sha "${SOURCE_SHA}" '
              [.workflow_runs[]
                | select(.head_sha == $sha and .event == "push")]
              | sort_by(.run_number)
              | last // empty
            ' <<<"${eval_runs}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${eval_run:-null}")"
            if [[ "${conclusion}" == "success" ]]; then
              break
            fi
            if [[ -n "${conclusion}" ]]; then
              printf '同一提交的 Eval PR Gate 未通过：%s\n' "${conclusion}" >&2
              exit 1
            fi
            sleep 15
          done
          test "$(jq -r '.conclusion // empty' <<<"${eval_run:-null}")" = "success"
          eval_run_id="$(jq -r '.id' <<<"${eval_run}")"

          short_sha="${SOURCE_SHA:0:12}"
          evidence_dir="data/release-evidence/${short_sha}"
          mkdir -p "${evidence_dir}"
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg kt_sha "${kt_sha}" \
            --arg quality_run_id "${QUALITY_RUN_ID}" \
            --arg eval_run_id "${eval_run_id}" \
            '{
              schema_version: 1,
              source_sha: $source_sha,
              kt_sha: $kt_sha,
              suites: {
                "backend-full": {
                  run_id: $quality_run_id,
                  job: "backend",
                  conclusion: "success"
                },
                "frontend-lint-build": {
                  run_id: $quality_run_id,
                  job: "frontend",
                  conclusion: "success"
                },
                "eval-pr-gate": {
                  run_id: $eval_run_id,
                  job: "eval-pr-gate",
                  conclusion: "success"
                }
              }
            }' >"${evidence_dir}/verification-results.json"
          printf 'kt_sha=%s\n' "${kt_sha}" >>"${GITHUB_OUTPUT}"
          printf 'short_sha=%s\n' "${short_sha}" >>"${GITHUB_OUTPUT}"
          printf 'evidence_dir=%s\n' "${evidence_dir}" >>"${GITHUB_OUTPUT}"

      - name: 构建并推送单架构 Runtime 镜像
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nanobot-runtime"
          image_tag="${image_repo}:${SOURCE_SHA}"
          git_commit_date="$(git show -s --format=%cI "${SOURCE_SHA}")"
          evidence_dir="${{ steps.verification.outputs.evidence_dir }}"
          build_context_sha256="$(
            python scripts/build_context_manifest.py \
              --root . \
              --dockerignore .dockerignore \
              --include-git-identity \
              --output "${evidence_dir}/build-context.json" \
              --print-sha
          )"
          test "$(
            jq '.untracked_context_files | length' \
              "${evidence_dir}/build-context.json"
          )" = "0"
          metadata_file="$(mktemp)"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "GIT_COMMIT=${SOURCE_SHA:0:7}" \
            --build-arg "GIT_BRANCH=master" \
            --build-arg "GIT_FULL_COMMIT=${SOURCE_SHA}" \
            --build-arg "GIT_COMMIT_DATE=${git_commit_date}" \
            --build-arg "GIT_DIRTY=false" \
            --build-arg "BUILD_CONTEXT_SHA256=${build_context_sha256}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --provenance=mode=max \
            --sbom=true \
            --tag "${image_tag}" \
            --metadata-file "${metadata_file}" \
            --push \
            .
          digest="$(jq -r '.["containerimage.digest"]' "${metadata_file}")"
          test "${digest}" != "null"
          test "${digest}" != ""
          image_reference="${image_repo}@${digest}"
          docker pull "${image_reference}" >/dev/null
          image_id="$(docker image inspect "${image_reference}" --format '{{.Id}}')"
          revision="$(docker image inspect "${image_reference}" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "${image_id}" != ""
          test "${revision}" = "${SOURCE_SHA}"
          printf 'reference=%s\n' "${image_reference}" >>"${GITHUB_OUTPUT}"
          printf 'image_id=%s\n' "${image_id}" >>"${GITHUB_OUTPUT}"
          printf 'build_context_sha256=%s\n' \
            "${build_context_sha256}" >>"${GITHUB_OUTPUT}"

      - name: 生成 SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.reference }}
          format: spdx-json
          output-file: ${{ steps.verification.outputs.evidence_dir }}/runtime.spdx.json
          upload-artifact: false

      - name: 生成并校验 ArtifactManifest 与 ReleaseManifest
        shell: bash
        env:
          NANOBOT_RUNTIME_IMAGE: ${{ steps.image.outputs.reference }}
          RUNTIME_IMAGE_ID: ${{ steps.image.outputs.image_id }}
          KT_SHA: ${{ steps.verification.outputs.kt_sha }}
          EVIDENCE_DIR: ${{ steps.verification.outputs.evidence_dir }}
          BUILD_CONTEXT_SHA256: ${{ steps.image.outputs.build_context_sha256 }}
        run: |
          set -euo pipefail
          python scripts/build_release_manifest.py artifact \
            --profile nanobot-runtime \
            --git-full-commit "${SOURCE_SHA}" \
            --git-dirty false \
            --kt-commit "${KT_SHA}" \
            --input python_lock=requirements-prod.lock \
            --input web_lock=webui/package-lock.json \
            --input prompt_defaults=prompts.v2.default \
            --input-sha "build_context=${BUILD_CONTEXT_SHA256}" \
            --schema-migration-head 20260730_llm_request_execution_phase \
            --image-reference "${NANOBOT_RUNTIME_IMAGE}" \
            --image-id "${RUNTIME_IMAGE_ID}" \
            --sbom-file "${EVIDENCE_DIR}/runtime.spdx.json" \
            --dependency-manifest-file requirements-prod.lock \
            --verification-suite backend-full \
            --verification-suite eval-pr-gate \
            --verification-suite frontend-lint-build \
            --verification-results "${EVIDENCE_DIR}/verification-results.json" \
            --builder-version "github-actions-${GITHUB_RUN_ID}" \
            --output "${EVIDENCE_DIR}/runtime-artifact.json"
          python scripts/build_release_manifest.py release \
            --artifact "${EVIDENCE_DIR}/runtime-artifact.json" \
            --output "${EVIDENCE_DIR}/release.json"
          python scripts/build_release_manifest.py validate \
            --manifest "${EVIDENCE_DIR}/release.json" \
            --runtime-image "${NANOBOT_RUNTIME_IMAGE}" \
            --require-built
          sha256sum \
            "${EVIDENCE_DIR}/runtime.spdx.json" \
            "${EVIDENCE_DIR}/verification-results.json" \
            "${EVIDENCE_DIR}/build-context.json" \
            "${EVIDENCE_DIR}/runtime-artifact.json" \
            "${EVIDENCE_DIR}/release.json" \
            >"${EVIDENCE_DIR}/SHA256SUMS"
          bundle="runtime-release-${SOURCE_SHA}.tar"
          tar --create --file "${bundle}" "${EVIDENCE_DIR}"
          sha256sum "${bundle}" >"${bundle}.sha256"

      - name: 上传不可变发布证据
        uses: actions/upload-artifact@v7
        with:
          name: runtime-release-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 90
          path: |
            runtime-release-${{ env.SOURCE_SHA }}.tar
            runtime-release-${{ env.SOURCE_SHA }}.tar.sha256
