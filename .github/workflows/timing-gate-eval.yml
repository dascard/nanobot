name: Eval PR Gate

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * 0"
  push:
    branches:
      - main
      - master

jobs:
  eval-pr-gate:
    runs-on: ubuntu-latest
    env:
      NANOBOT_TESTING: "1"
      DATABASE_URL: "sqlite:///:memory:"
      NEW_API_KEY: "test-key-for-ci"
      NANOBOT_ADMIN_TOKEN: "test-admin-token"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply KohakuTerrarium patches
        run: bash scripts/apply_kohaku_patches.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run eval PR gate
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: bash scripts/run_eval_pr_gate.sh

      - name: Run periodic eval gate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/run_eval_periodic.sh

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            evals/reports/*.json
            evals/reports/periodic_manifest_*.json
            evals/reports/runs/**/manifest.json
            evals/reports/runs/**/timing_signal_audit.json
            tmp/rag_benchmark/reports/*.json
            tmp/rag_benchmark/reports/*.md
