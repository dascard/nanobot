name: 通用质量门禁

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-impact:
    runs-on: ubuntu-latest
    steps:
      - name: 检出影响分析所需源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 生成本次推送的 Release Impact
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            push)
              base_sha="${BEFORE_SHA}"
              ;;
            pull_request)
              base_sha="${PR_BASE_SHA}"
              ;;
            *)
              base_sha="$(git rev-parse HEAD^)"
              ;;
          esac
          mkdir -p "${RUNNER_TEMP}/release-impact"
          output="${RUNNER_TEMP}/release-impact/release-impact.json"
          if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ \
              || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            python scripts/build_release_impact.py \
              --path Dockerfile \
              --strict >"${output}"
          else
            python scripts/build_release_impact.py \
              --base "${base_sha}" \
              --head "${GITHUB_SHA}" \
              --strict >"${output}"
          fi
          jq -e '.schema_version == 1 and (.artifacts|type) == "array"' \
            "${output}" >/dev/null
          cat "${output}"

      - name: 上传 Release Impact
        uses: actions/upload-artifact@v7
        with:
          name: release-impact
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/release-impact/release-impact.json

  backend:
    runs-on: ubuntu-latest
    env:
      NANOBOT_TESTING: "1"
      DATABASE_URL: "sqlite:///:memory:"
      NEW_API_KEY: "test-key-for-ci"
      NANOBOT_ADMIN_TOKEN: "test-admin-token"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 应用 KT 兼容补丁
        run: bash scripts/apply_kohaku_patches.sh

      - name: 安装锁定依赖
        run: |
          python -m pip install --upgrade pip
          torch_requirement="$(sed -n '/^torch==/p' requirements-test.lock)"
          python -m pip install --no-deps \
            --index-url https://download.pytorch.org/whl/cpu \
            "${torch_requirement}"
          python -m pip install -r requirements-test.lock
          python -m pip install --no-deps ./vendor/KohakuTerrarium
          python -m pip install ruff==0.15.12
          python -m pip check

      - name: 检查架构边界
        run: python scripts/check_architecture.py

      - name: 检查 OpenAPI 与生成客户端漂移
        run: python scripts/generate_openapi_client.py --check

      - name: 检查 Release Impact Golden
        run: python scripts/build_release_impact.py --check-golden

      - name: 检查 Verification Plan Golden
        run: python scripts/build_verification_plan.py --check-golden

      - name: 检查决策规则清单漂移
        run: python scripts/audit_decision_rules.py --check

      - name: 检查语义 Task SLO Manifest 漂移
        run: python scripts/build_task_slo_manifest.py --check

      - name: 检查 Python 致命静态错误
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: 校验 Compose
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose -f docker-compose.yml config --quiet
          NANOBOT_RUNTIME_IMAGE="example.invalid/nanobot@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
          NANOBOT_PRODUCTION_ENV_FILE="$PWD/.env.example" \
          NANOBOT_PRODUCTION_DATA_DIR="$PWD/data" \
          NANOBOT_PRODUCTION_MODELS_DIR="$PWD/models" \
          NANOBOT_PRODUCTION_SENTINEL_DIR="$PWD/sentinel" \
          NANOBOT_PROMPT_HOST_ROOT="/var/lib/nanobot/prompt-runtime" \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: 初始化 Prompt Runtime 验收副本
        run: >-
          python -c 'from core.prompt_v2.template_registry import
          init_prompt_v2_runtime_dir; init_prompt_v2_runtime_dir()'

      - name: 检查架构行为 Golden 漂移
        run: python scripts/build_behavior_baseline.py --check

      - name: 运行完整测试
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: 安装前端依赖
        working-directory: webui
        run: npm ci

      - name: 前端静态检查
        working-directory: webui
        run: npm run lint

      - name: 前端构建
        working-directory: webui
        run: npm run build

      - name: 记录生产依赖审计并阻断 Critical
        working-directory: webui
        run: npm audit --omit=dev --audit-level=critical
