# Nanobot Agent Configuration — KohakuTerrarium Format
name: nanobot
version: "1.0"

controller:
  provider: openai
  model: ${LLM_MODEL_SMART:-deepseek-chat}
  base_url: ${NEW_API_BASE_URL:-https://api.new-api.com/v1}
  api_key_env: NEW_API_KEY
  temperature: 0.7
  max_retries: 0                 # Fail fast on proxy timeout/502 to trigger custom model routing fallback
  tool_format: native            # Re-enabling native function calling per user request
  include_tools_in_prompt: false # 工具清单以 API tools schema 为准，避免 prompt 与硬裁剪不一致
  include_hints_in_prompt: false # 不注入 KT 默认工具说明；reply/no_reply 契约由项目 prompt 控制
  max_messages: 50               # auto-compaction threshold
  ephemeral: false              # 桥接层已手动清理 conversation，KT 不需再清（会删掉 reply 工具输出）
  max_iterations: 12             # 硬兜底——正常靠 prompt 自控，此值仅防死循环

# ── Memory ──
memory:
  path: ./memory

# ── Tools ──
tools:
  - name: sql_analysis
    type: package
    module: nanobot_kt.tools.sql_analysis
    class: SQLAnalysisTool
  - name: ai_daily
    type: package
    module: nanobot_kt.tools.ai_daily
    class: AiDailyTool
  - name: memory_query
    type: package
    module: nanobot_kt.tools.memory_query
    class: MemoryQueryTool
  - name: knowledge_query
    type: package
    module: nanobot_kt.tools.knowledge_query
    class: KnowledgeQueryTool
  - name: web_search
    type: package
    module: nanobot_kt.tools.web_search
    class: WebSearchTool
  - name: image_summary
    type: package
    module: nanobot_kt.tools.image_summary
    class: ImageSummaryTool
  - name: image_generation
    type: package
    module: nanobot_kt.tools.image_generation
    class: ImageGenerationTool
  - name: persona_update
    type: package
    module: nanobot_kt.tools.persona_update
    class: PersonaUpdateTool
  - name: schedule_task
    type: package
    module: nanobot_kt.tools.schedule_task
    class: ScheduleTaskTool
  - name: group_analysis
    type: package
    module: nanobot_kt.tools.group_analysis
    class: GroupAnalysisTool
  - name: sticker_search
    type: package
    module: nanobot_kt.tools.sticker_search
    class: StickerSearchTool
  - name: reply
    type: package
    module: nanobot_kt.tools.reply
    class: ReplyTool
  - name: no_reply
    type: package
    module: nanobot_kt.tools.reply
    class: NoReplyTool
  - name: sandbox_exec
    type: package
    module: nanobot_kt.tools.sandbox
    class: SandboxExecTool
  - name: workspace_list
    type: package
    module: nanobot_kt.tools.sandbox
    class: WorkspaceListTool
  - name: workspace_read
    type: package
    module: nanobot_kt.tools.sandbox
    class: WorkspaceReadTool
  - name: workspace_search
    type: package
    module: nanobot_kt.tools.sandbox
    class: WorkspaceSearchTool
  - name: workspace_write
    type: package
    module: nanobot_kt.tools.sandbox
    class: WorkspaceWriteTool
  - name: asset_import
    type: package
    module: nanobot_kt.tools.sandbox
    class: AssetImportTool
  - name: asset_publish
    type: package
    module: nanobot_kt.tools.sandbox
    class: AssetPublishTool

# ── Output ──
output:
  type: custom
  module: nanobot_kt.output
  class: BufferedOutput
