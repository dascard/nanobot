# Nanobot Agent Configuration — KohakuTerrarium Format
name: nanobot
version: "1.0"

controller:
  provider: openai
  model: ${LLM_MODEL_SMART:-deepseek-chat}
  base_url: ${NEW_API_BASE_URL:-https://api.new-api.com/v1}
  api_key_env: NEW_API_KEY
  temperature: 0.7
  max_retries: 0                 # Fail fast on proxy timeout/502 to trigger custom model routing fallback
  tool_format: native            # Re-enabling native function calling per user request
  max_messages: 50               # auto-compaction threshold
  ephemeral: true               # clear conversation after each interaction (per-session memory injected via DB)
  max_iterations: 30             # 硬兜底——正常靠 prompt 自控，此值仅防死循环

# ── Memory ──
memory:
  path: ./memory

# ── Tools ──
tools:
  - name: sql_analysis
    type: package
    module: nanobot_kt.tools.sql_analysis
    class: SQLAnalysisTool
  - name: python_sandbox
    type: package
    module: nanobot_kt.tools.python_sandbox
    class: PythonSandboxTool
  - name: news_search
    type: package
    module: nanobot_kt.tools.news_search
    class: NewsSearchTool
  - name: image_summary
    type: package
    module: nanobot_kt.tools.image_summary
    class: ImageSummaryTool
  - name: persona_update
    type: package
    module: nanobot_kt.tools.persona_update
    class: PersonaUpdateTool
  - name: schedule_task
    type: package
    module: nanobot_kt.tools.schedule_task
    class: ScheduleTaskTool
  - name: group_analysis
    type: package
    module: nanobot_kt.tools.group_analysis
    class: GroupAnalysisTool
  - name: reply
    type: package
    module: nanobot_kt.tools.reply
    class: ReplyTool
  # KT built-in file tools — sandboxed to ./workspace (PathBoundaryGuard mode=block)
  - name: read
    type: builtin
  - name: write
    type: builtin
  - name: edit
    type: builtin
  - name: grep
    type: builtin
  - name: glob
    type: builtin
  - name: bash
    type: builtin

# ── Sub-Agents ──
subagents:
  - name: memory_read
    type: builtin
  - name: memory_write
    type: builtin

# ── Output ──
output:
  type: custom
  module: nanobot_kt.output
  class: BufferedOutput

# ── System Prompt ──
system_prompt_file: prompt.md
